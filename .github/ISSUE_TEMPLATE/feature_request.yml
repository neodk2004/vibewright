name: 💡 Feature request / Idee
description: An idea that would make Vibewright better – eine Idee, die Vibewright besser macht
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation or problem – not only the solution.
    validations:
      required: true
  - type: textarea
    id: idee
    attributes:
      label: Your idea
      description: How could Vibewright help? Sketches and screenshots welcome.
  - type: textarea
    id: alternativen
    attributes:
      label: Alternatives you considered
