# Builds the macOS app for Apple Silicon (arm64) and Intel (x64) on a GitHub-hosted Mac and smoke-tests it.
# Intel is cross-built on the Apple Silicon runner and tested via Rosetta 2.
# Result: .dmg + .zip and screenshots as a workflow artifact.
name: Build macOS

on:
  push:
    branches: [mac]
  workflow_dispatch:
    inputs:
      arch:
        description: Which architecture to build
        type: choice
        options: [both, arm64, x64]
        default: both

permissions:
  contents: read

jobs:
  build:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-latest # Apple Silicon runner, builds both architectures
    timeout-minutes: 240 # Apple's first notarizations for a new developer account can take a long time
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON((inputs.arch == 'arm64' && '["arm64"]') || (inputs.arch == 'x64' && '["x64"]') || '["arm64","x64"]') }}
    env:
      # electron-builder output folder: mac-arm64 for Apple Silicon, mac for Intel
      APPDIR: ${{ matrix.arch == 'arm64' && 'dist/mac-arm64' || 'dist/mac' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Intel only – add the x64 binaries of node-pty and Rosetta 2
        if: matrix.arch == 'x64'
        run: |
          # npm refuses x64 packages on an arm64 runner (EBADPLATFORM) → download and unpack the package directly
          mkdir -p node_modules/@lydell/node-pty-darwin-x64
          TGZ=$(npm pack @lydell/node-pty-darwin-x64@1.1.0 --silent)
          tar -xzf "$TGZ" -C node_modules/@lydell/node-pty-darwin-x64 --strip-components=1
          rm "$TGZ"
          ls node_modules/@lydell/node-pty-darwin-x64
          for f in node_modules/@lydell/node-pty-darwin-x64/*.node; do echo "$f → $(lipo -archs "$f")"; done
          /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license

      - name: Test – node-pty works inside Electron
        if: matrix.arch == 'arm64'
        run: perl -e 'alarm 60; exec @ARGV' npx electron test/pty-check.js

      - name: Show Apple's notarization queue for this account
        if: matrix.arch == 'arm64'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "$APPLE_ID" ] || { echo "No Apple secrets – skipped"; exit 0; }
          xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" | head -20 || true

      # With the Apple secrets: signed with Developer ID + notarized by Apple.
      # Without them: ad-hoc signed (build/adhoc-signieren.js) – runs, but Gatekeeper warns once.
      - name: Build .dmg and .zip
        env:
          CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Missing secrets arrive as empty strings → treat them as "not set"
          [ -n "$APPLE_ID" ] || unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          if [ -n "$CERT_P12_BASE64" ]; then
            # Own keychain with Apple's `security` tool – electron-builder's temporary keychain fails on current runners
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            KC_PASS=$(openssl rand -hex 24)
            echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KC_PASS" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            rm -f "$RUNNER_TEMP/cert.p12"
            security find-identity -v -p codesigning "$KEYCHAIN" | grep -c "Developer ID Application" > /dev/null
            export CSC_KEYCHAIN="$KEYCHAIN"
            export CSC_NAME="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"Developer ID Application: \(.*\)"/\1/p' | head -1)"
            echo "Signing: Developer ID"
          else
            echo "Signing: ad-hoc"
          fi
          if [ -n "${APPLE_ID:-}" ]; then echo "Notarization: yes"; else echo "Notarization: no"; fi
          # DEBUG: electron-builder zeigt sonst bei codesign-Fehlern nicht den eigentlichen Grund
          DEBUG=electron-builder npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Check signature and notarization
        run: |
          APP="$APPDIR/Vibewright.app"
          echo "Architecture: $(lipo -archs "$APP/Contents/MacOS/Vibewright")"
          find "$APPDIR" -name "*.node" -path "*node-pty*" -exec sh -c 'echo "node-pty: $(basename "$1") → $(lipo -archs "$1")"' _ {} \;
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Authority|Signature|TeamIdentifier|flags" || true
          if spctl -a -vv "$APP"; then echo "✅ Gatekeeper accepts the app (signed + notarized)"; else echo "ℹ️ Not notarized – expected without the Apple secrets"; fi

      - name: Smoke test – start the built app and take screenshots
        run: |
          set -euo pipefail
          APP="$APPDIR/Vibewright.app/Contents/MacOS/Vibewright"   # Intel build runs via Rosetta 2
          # Rosetta translates the whole Electron framework on the first Intel start – that alone can take 50–90 s on the runner
          ZEIT=$([ "${{ matrix.arch }}" = x64 ] && echo 300 || echo 90)
          ls -la dist "$APPDIR"
          mkdir -p shots /tmp/kph/ablage
          echo '{"modus":"lokal","ablage":"/tmp/kph/ablage","sprache":"de"}' > /tmp/kph/einstellungen.json
          # Claude Code is not installed on the runner → the welcome/setup page must appear
          KPH_USERDATA=/tmp/kph SCREENSHOT="$PWD/shots/start-de.png" SCREENSHOT_DELAY=8000 perl -e "alarm $ZEIT; exec @ARGV" "$APP"
          echo '{"modus":"lokal","ablage":"/tmp/kph/ablage","sprache":"en"}' > /tmp/kph/einstellungen.json
          KPH_USERDATA=/tmp/kph SCREENSHOT="$PWD/shots/start-en.png" SCREENSHOT_DELAY=8000 perl -e "alarm $ZEIT; exec @ARGV" "$APP"
          if [ "${{ matrix.arch }}" = arm64 ]; then perl -e 'alarm 60; exec @ARGV' npx electron test/splash-check.js "$PWD/shots/splash.png"; fi
          ls -la shots
          test -s shots/start-de.png && test -s shots/start-en.png

      - uses: actions/upload-artifact@v4
        with:
          name: vibewright-mac-${{ matrix.arch }}
          path: |
            app/dist/*.dmg
            app/dist/*.zip
            app/shots/*.png
          retention-days: 14
