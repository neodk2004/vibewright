<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>Vibewright</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;-webkit-user-select:none;cursor:default}
  .karte{position:absolute;inset:10px;border-radius:18px;background:#121315;border:1px solid #26282d;
    box-shadow:0 18px 50px -12px #000c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-bottom:46px;
    font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;color:#e6e6e8;transition:opacity .35s,transform .35s}
  body.weg .karte{opacity:0;transform:scale(.97)}
  svg{width:92px;height:92px;overflow:visible}
  /* Logo: die Welle zeichnet sich, der Balken wächst, der Orb ploppt auf */
  .welle,.balken{stroke-dasharray:400;stroke-dashoffset:400} /* feste Länge statt pathLength – verhält sich auf allen Systemen gleich */
  .welle{animation:zeichnen .9s .15s cubic-bezier(.5,0,.3,1) forwards}
  .balken{animation:zeichnen .5s .95s cubic-bezier(.2,.8,.2,1) forwards}
  .orb,.glow{transform-origin:184px 66px;transform:scale(0)}
  .orb{animation:auf .45s 1.35s cubic-bezier(.2,1.6,.4,1) forwards}
  .glow{animation:auf .45s 1.35s forwards,puls 1.6s 1.8s ease-in-out infinite}
  @keyframes zeichnen{to{stroke-dashoffset:0}}
  @keyframes auf{to{transform:scale(1)}}
  @keyframes puls{50%{transform:scale(1.35);opacity:.5}}
  h1{margin:0;font-size:26px;font-weight:650;letter-spacing:.01em;animation:text .5s .5s both}
  p{margin:-8px 0 0;font-size:13px;color:#8d9199;animation:text .5s .65s both}
  @keyframes text{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .bar{width:180px;height:3px;border-radius:2px;background:#26282d;overflow:hidden;margin-top:6px;animation:text .4s .8s both}
  .bar i{display:block;width:40%;height:100%;border-radius:2px;background:linear-gradient(90deg,#9d8cff,#5fd0e0);animation:lauf 1.2s ease-in-out infinite}
  @keyframes lauf{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
  .fuss{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:11px;line-height:1.6;color:#5b5f66;animation:text .4s 1s both}
  .fuss span{color:#8d9199}
  /* „Bewegung reduzieren“: keine Animationen – das Logo steht sofort im fertigen Zustand da */
  @media (prefers-reduced-motion:reduce){*{animation:none !important}.welle,.balken{stroke-dashoffset:0}.orb,.glow{transform:none}}
</style>
</head>
<body>
  <div class="karte">
